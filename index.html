      var lastSync = localStorage.getItem('dhre_ai_last_sync');
      var now = Date.now();
      if (!lastSync || now - parseInt(lastSync) > 30000) {
        localStorage.setItem('dhre_ai_last_sync', now.toString());
        localStorage.setItem('dhre_ai_period', currentPeriod);
        renderSection();
        syncStatus();
      }
    }, 15000);

    window.addEventListener('storage', function(e) {
      if (e.key === 'dhre_ai_period' && e.newValue !== currentPeriod) {
        currentPeriod = e.newValue;
        renderSection();
        syncStatus();
      }
      if (e.key === 'dhre_ai_refresh' || e.key === 'dhre-combined-auth' || e.key === 'dhre_current_page') {
        updateVisibility();
        renderSection();
        syncStatus();
      }
    });

    window.addEventListener('dhre-page-change', function() {
      if (updateVisibility()) { renderSection(); syncStatus(); }
    });

    window.addEventListener('dhre-dashboard-update', function() {
      if (updateVisibility()) { renderSection(); syncStatus(); }
    });

    var rootEl = document.getElementById('root');
    if (rootEl && typeof MutationObserver !== 'undefined') {
      new MutationObserver(function() { updateVisibility(); }).observe(rootEl, { childList: true, subtree: true });
    }
  }

  updateVisibility();
  renderSection();
  startAutoSync();
})();
</script>
<script>
(function(){
  var API = 'https://test-1-blond-tau.vercel.app/api/sync';
  var COLS = ['sites','incidents','accidents'];
  var KEY = { sites:'site-inspection-sites-v80', incidents:'site-inspection-incidents', accidents:'dhre-accidents' };
  var REVKEY = '__dhre_sync_rev';
  function revOf(){ try { return JSON.parse(localStorage.getItem(REVKEY)||'{}') } catch(e){ return {} } }
  function setRev(r){ try{ localStorage.setItem(REVKEY, JSON.stringify(r)) }catch(e){} }
  async function push(col){
    try{
      var raw = localStorage.getItem(KEY[col]);
      if (raw == null) return;
      var resp = await fetch(API, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ collection: col, payload: JSON.parse(raw) }) });
      var j = await resp.json().catch(function(){ return null });
      if (j && j.rev) { var r = revOf(); r[col] = j.rev; setRev(r); }
    }catch(e){}
  }
  async function pull(col){
    try{
      var resp = await fetch(API + '?collection=' + col);
      if (!resp.ok) return false;
      var res = await resp.json().catch(function(){ return null });
      if (!res || !res.payload || !res.rev) return false;
      var r = revOf();
      if (res.rev <= (r[col] || 0)) return false;
      var newStr = JSON.stringify(res.payload);
      var cur = localStorage.getItem(KEY[col]);
      r[col] = res.rev; setRev(r);
      if (newStr === cur) return false;
      localStorage.setItem(KEY[col], newStr);
      return true;
    }catch(e){ return false }
  }
  async function seed(){
    for (var i=0;i<COLS.length;i++){ var c=COLS[i];
      try{ var r=await fetch(API+'?collection='+c); var res=await r.json().catch(function(){return null});
        if(!res || !res.payload){ await push(c); } }catch(e){}
    }
  }
  COLS.forEach(function(c){
    var k = KEY[c]; var prev = localStorage.getItem(k);
    setInterval(function(){ var cur = localStorage.getItem(k); if (cur !== prev) { prev = cur; push(c); } }, 2000);
  });
  async function tick(){
    var any = false;
    for (var i=0;i<COLS.length;i++){ try{ if (await pull(COLS[i])) any = true; }catch(e){} }
    if (any) location.reload();
  }
  seed(); tick();
  setInterval(tick, 7000);
})();
</script>

    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    alert('Data exported. Copy the downloaded JSON file to your other browser and use Import Data there.');
  };
  window.__dhreImport = function () {
    var input = document.createElement('input');
    input.type = 'file';
    input.accept = '.json,application/json';
    input.onchange = function () {
      var f = input.files && input.files[0];
      if (!f) return;
      var reader = new FileReader();
      reader.onload = function () {
        try {
          var data = JSON.parse(reader.result);
          Object.keys(data).forEach(function (k) { localStorage.setItem(k, data[k]); });
          alert('Data imported successfully. The page will reload.');
          location.reload();
        } catch (e) {
          alert('Invalid backup file.');
        }
      };
      reader.readAsText(f);
    };
    input.click();
  };
})();

<script>

  window.addEventListener('storage', function(e){
    if(!e || !e.key || !e.newValue) return;

    else if(e.key===KEYS.incidents) col='incidents';
    else if(e.key===KEYS.accidents) col='accidents';

    var ch = openBC(); if(!ch) return;
    try {
      var arr = JSON.parse(e.newValue);
      if(!Array.isArray(arr)) { ch.close(); return; }
      if(col==='sites'){ ch.postMessage({type:'sites-update',sites:arr}); ch.postMessage({type:'dhre-sites-update',sites:arr}); }
      if(col==='incidents'){ ch.postMessage({type:'incidents-update',incidents:arr}); ch.postMessage({type:'dhre-incidents-update',incidents:arr}); }
      if(col==='accidents'){ ch.postMessage({type:'accidents-update',accidents:arr}); ch.postMessage({type:'dhre-accidents-update',accidents:arr}); }
    } catch(err){}
    try { ch.close(); } catch(err){}
    try { window.dispatchEvent(new Event('dhre-dashboard-update')); } catch(err){}
  });
